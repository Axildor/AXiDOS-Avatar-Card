name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run verify

      - name: Verify bop tail behavior
        run: node scripts/verify_bop_tail.mjs

      - name: Verify dance smoothness
        run: node scripts/verify_dance_smoothness.mjs

      - name: Commit rebuilt bundle if changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet axidos-card.js; then
            git add axidos-card.js
            git commit -m "chore: rebuild axidos-card.js from src/ [skip ci]"
            git push
          else
            echo "Bundle is up to date with src/"
          fi