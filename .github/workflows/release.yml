name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run verify

      - name: Verify bop tail behavior
        run: node scripts/verify_bop_tail.mjs

      - name: Verify dance smoothness
        run: node scripts/verify_dance_smoothness.mjs

      - name: Extract changenotes from CHANGELOG.md
        run: |
          awk '/^## /{if(found) exit; found=1} found' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: axidos-card.js