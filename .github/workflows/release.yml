name: Release

# Trigger on BARE SEMVER ONLY (e.g. 5.8.0).
#
# DO NOT add a 'v*' pattern back. This repo's stable tags are bare semver
# (5.7.0, 5.8.0); `v`-prefixed tags were only ever an occasional alias. With
# BOTH patterns listed, pushing `5.8.0` and `v5.8.0` at the same commit matched
# TWO tag pushes and produced TWO identical published releases (releases
# 437139539 and 437139576, 2026-11-06) — one per pattern, both from the same
# commit, both attaching the same axidos-card.js. 5.5.1 hit the same trap
# earlier and it went unnoticed.
#
# If a `v`-prefixed tag is ever needed for external tooling, create it with a
# tag name that does NOT match this glob, or delete the extra release
# immediately; do not widen the trigger.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run verify

      - name: Verify bop tail behavior
        run: node scripts/verify_bop_tail.mjs

      - name: Verify dance smoothness
        run: node scripts/verify_dance_smoothness.mjs

      - name: Verify mechanical motion (5.8.0)
        run: node scripts/verify_mechanical_motion.mjs

      - name: Extract changenotes from CHANGELOG.md
        run: |
          awk '/^## /{if(found) exit; found=1} found' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: axidos-card.js
          # Pre-release when the tag carries a suffix (e.g. 5.7.0-beta.1):
          # HACS only offers prereleases to users who enabled beta releases
          # for the repo, so the beta test cohort is opt-in by construction.
          prerelease: ${{ contains(github.ref, '-') }}